version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: aicode_redis
    ports:
      - "6379:6379"
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: aicode_postgres
    environment:
      POSTGRES_USER: aicode_user
      POSTGRES_PASSWORD: aicode_password
      POSTGRES_DB: aicode_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
